[project]
name = "btc-intel"
version = "0.1.0"
description = "Offline Bitcoin transaction forensics (SIH26146)"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "networkx>=3.3",
    "scikit-learn>=1.5",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generator", "ingest", "graph", "features", "engines", "fusion", "api", "eval", "offline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
exclude = ["vendor"]
