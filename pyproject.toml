[project]
name = "btc-intel"
version = "0.1.0"
description = "Offline Bitcoin transaction forensics (SIH26146)"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "networkx>=3.3",
    "scikit-learn>=1.5",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "maxminddb>=2.6",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]
# The GNN engine only. Everything else — ingest, graph, features, rules —
# runs without torch, which keeps the offline install small when it is not wanted.
gnn = ["torch>=2.2", "torch-geometric>=2.5"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "joblib>=1.4", "reportlab>=4.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Top-level packages only: hatch ships a declared package's subpackages with it,
# so `eval/ground_truth/` needs no entry of its own. tests/test_packages.py
# asserts both halves of that — every top-level package is listed, and every
# nested package has an __init__.py and a declared parent, so nothing imports
# from a checkout and then goes missing from the wheel.
packages = ["generator", "ingest", "graph", "features", "engines", "fusion", "p2p", "origination", "analysis", "api", "eval", "offline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
exclude = ["vendor"]
