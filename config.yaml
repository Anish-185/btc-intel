# Single source of truth for every stage. Nothing below is hardcoded elsewhere.
# NTRO's real dumps may use different field names — remap here, not in code.

schema:
  # our canonical name -> field name in the incoming dataset (NTRO's may differ)
  timestamp: timestamp
  src_ip: src_ip
  dst_ip: dst_ip
  src_port: src_port
  dst_port: dst_port
  tx_id: txid
  input_addresses: input_addresses
  output_addresses: output_addresses
  input_amounts: input_amounts
  output_amounts: output_amounts
  fee: fee
  script_type: script_type
  geo_country: geo_country
  asn: asn

ingest:
  input_dir: data/raw
  processed_dir: data/processed
  format: csv            # csv | json | xml — which file to read from a directory
  quarantine_path: data/processed/quarantine.parquet
  output_path: data/processed/transactions.parquet
  timestamp_unit: iso    # s | ms | iso
  list_separator: ";"    # how list fields are packed into a single CSV cell

intel:
  # Public IP intelligence, fetched once by offline/fetch_intel.sh. Read from
  # disk only — the pipeline never touches the network.
  dir: data/intel
  known_nodes: known_bitcoin_nodes.json
  tor_exits: tor_exit_nodes.txt
  hosting_asns: hosting_asns.txt
  manifest: manifest.json
  # Synthetic stand-in written beside a generated dataset. Holds only what the
  # real world publishes (which IPs are public relays, Tor exits, hosting) —
  # never who owns what. That lives in ground_truth.json and is never read here.
  synthetic_node_intel: node_intel.json

geoip:
  country_db: data/geoip/GeoLite2-Country.mmdb
  asn_db: data/geoip/GeoLite2-ASN.mmdb
  city_db: data/geoip/GeoLite2-City.mmdb   # optional, unused for now
  # VPN / hosting / Tor-adjacent ASNs. Small starter list — expand later.
  # An IP in one of these is weak evidence of location or identity, so the
  # correlation engine discounts it.
  high_risk_asns:
    - 14061   # DigitalOcean
    - 16509   # AWS
    - 24940   # Hetzner
    - 9009    # M247
    - 208294  # Tor exit operator (example)
    - 4224    # Calyx / Tor-adjacent (example)
    - 60729   # Zwiebelfreunde (Tor)
    - 53667   # FranTech / BuyVM
    - 20473   # Vultr / Choopa
    - 63949   # Akamai (Linode)

models:
  anomaly: models/isolation_forest.joblib
  gnn: models/gnn.pt
  scaler: models/scaler.joblib

graph:
  # address clustering heuristics (reimplemented from BlockSci's published
  # definitions — see docs/vendor_notes.md; nothing is imported from vendor/)
  common_input_ownership: true
  change_detection: true
  max_hops: 4

  coinjoin:
    # common-input-ownership is skipped on transactions that look like this
    min_inputs: 3
    min_outputs: 3
    min_equal_outputs: 3        # how many outputs must share one value
    equal_value_tolerance: 0.02 # relative, so near-equal CoinJoin outputs still count
    dust_btc: 0.0000273         # BlockSci excludes dust-valued "equal" outputs

  change:
    heuristics: [address_reuse, address_type, optimal_change, peeling_chain]
    min_votes: 2                # below this the change output is left undecided
    # a tie between outputs is never resolved — guessing here corrupts clusters

  collapse_guard:
    max_cluster_wallets: 500    # above this a cluster is flagged, not trusted
    reason: "suspicious_merge — needs review"

features:
  entity_path: data/processed/features.parquet
  transaction_path: data/processed/features_tx.parquet

  # "suspiciously round": a multiple of one of these, to within the tolerance
  round_units: [1.0, 0.5, 0.1, 0.05, 0.01]
  round_tolerance: 0.000000001   # sub-satoshi: absorbs float error, not a real 1-sat difference

  # velocity is txs/day; short-lived entities are not divided by a tiny window
  velocity_min_window_days: 1.0

  dormancy:
    gap_days: 30            # quiet for at least this long...
    burst_transactions: 5   # ...then this many transactions...
    burst_window_days: 1.0  # ...inside this window

engines:
  rules:
    alerts_path: data/processed/rule_alerts.parquet
    # An alert that only just meets a rule's threshold scores base_score; the
    # score climbs to 1.0 as the evidence piles up. min_score then decides what
    # is worth writing — raise it to drop borderline alerts, lower it for recall.
    min_score: 0.4
    base_score: 0.35

    ransomware_collector:
      min_senders: 5            # distinct wallets paying in
      target_senders: 25        # score saturates here
      first_time_sender_ratio: 0.6
      min_peel_hops: 2
      target_peel_hops: 8

    coinjoin:
      min_equal_outputs: 3
      target_equal_outputs: 8
      min_outputs: 3

    peel_chain:
      max_peel_ratio: 0.35      # a hop keeps most of the value, peels a little
      min_hops: 3
      target_hops: 10

    layering:
      min_fan_out: 4            # split width
      min_fan_in: 3             # merge width
      window_hours: 24
      max_hops: 6
      min_traced_inputs: 0.5    # share of the merge's inputs tracing back to the split

  gnn:
    scores_path: data/processed/gnn_scores.parquet
    # What counts as illicit when labelling from ground_truth.json. CoinJoin is
    # deliberately absent: mixing is suspicious, not by itself a crime.
    illicit_typologies: [ransomware_collector, layering]
    max_edges_per_tx: 64        # cap on the input x output expansion (CoinJoins)
    hidden: 64
    layers: 2
    dropout: 0.2
    lr: 0.005
    weight_decay: 0.0001
    epochs: 30
    seed: 42
    split: [0.6, 0.2, 0.2]      # chronological, never random
    entity_aggregation: max     # max | mean, when rolling edge scores up

  propagation:
    output_path: data/processed/tx_origins.parquet
    # Measured on generated data (tests/test_propagation.py prints the table).
    # The binding constraint is the ceiling: the true origin is only present in
    # the observed tree 20% / 34% / 63% of the time at relay-observation rates
    # 0.1 / 0.3 / 0.6. Against that ceiling first_timestamp reaches ~87%, the
    # hybrid ~65%, rumor centrality ~30% — because our origin appears as a
    # degree-1 leaf (origin -> entry node) while Shah & Zaman's estimator seeks
    # the tree's centre, a prior that fits full infected subtrees, not sparse
    # samples. All three are kept and comparable; re-measure on real data.
    estimator: first_timestamp   # first_timestamp | rumor_centrality | timestamp_weighted_centrality
    centrality_weight: 0.6      # timestamp_weighted: weight on rumor centrality
    timing_weight: 0.4          # ...and on how early the node reported
    runner_ups: 3

    # A public relay forwards thousands of other people's transactions, so its
    # presence near the root of an observed tree means almost nothing.
    class_weights:
      known_bitcoin_relay: 0.05
      tor_exit: 0.2
      hosting_vpn: 0.3
      residential_or_unknown: 1.0

    single_row_confidence: 0.15   # one observation is a guess, not an estimate

  anomaly:
    scores_path: data/processed/anomaly_scores.parquet
    # IsolationForest over the entity feature table. Unsupervised on purpose:
    # unlike the GNN it needs no labels, so it is the engine that still works
    # on NTRO's real unlabelled data.
    contamination: 0.05
    n_estimators: 200
    seed: 42
    features: [fan_in_ratio, fan_out_ratio, round_amount_ratio, velocity,
               lifetime_days, counterparties_in, counterparties_out, txs,
               value_in, value_out, unique_broadcast_ips, unique_asns,
               max_burst_transactions]

  correlation:
    output_path: data/processed/ip_correlation.parquet

    # Which IP counts as the broadcaster is decided by engines/propagation,
    # not by whichever hop happened to be recorded first. Each observation is
    # then weighted by that estimate's confidence before it counts as evidence.
    saturation_k: 2             # raw_confidence = 1 - exp(-effective_observations / k)
    high_risk_asn_factor: 0.2   # VPN / hosting / Tor-adjacent ASN
    shared_ip:
      free_entities: 3          # an IP tied to this many clusters is not penalised
      min_factor: 0.02          # floor, so a link is weakened but never erased
    min_score: 0.02             # below this the link is not worth writing

risk_weights:
  rules: 0.35
  anomaly: 0.25
  gnn: 0.25
  correlation: 0.15

eval:
  # The one canonical evaluation setup. Every number in eval/results.md comes
  # from these settings via `python -m eval.report` — no ad-hoc runs.
  seed: 41
  n_actors: 200
  n_transactions: 1200
  observation_rates: [0.1, 0.3, 0.6]
  default_rate: 0.3
  work_dir: data/processed/eval
  results_path: eval/results.md
  calibration_bins: 5

fusion:
  alerts_parquet: data/processed/final_alerts.parquet
  alerts_json: data/processed/final_alerts.json
  model_path: models/stacker.joblib
  alert_threshold: 0.5        # composite score above which an alert is explained

  taint:
    decay_per_hop: 0.5        # suspicion halves at every hop from the seed
    max_hops: 4               # beyond this, taint says nothing useful
    seed_rule_score: 0.7      # rules alerts at or above this seed the propagation
    min_taint: 0.01
    follow: outgoing          # outgoing | both — taint flows with the money

  stacker:
    signals: [rule_score, anomaly_score, gnn_score, correlation_score, taint_score]
    seed: 42
    test_fraction: 0.3        # chronological hold-out, never random
    max_iter: 2000

thresholds:
  low: 0.3
  medium: 0.6
  high: 0.8

api:
  host: 127.0.0.1
  port: 8000

offline: true   # no network calls anywhere in the pipeline

generator:
  start_time: "2026-01-01T00:00:00Z"
  seconds_between_txs: 12          # mean gap; actual gaps are exponential
  script_types: [p2wpkh, p2pkh, p2sh, p2wsh, p2tr]
  script_type_weights: [0.55, 0.15, 0.12, 0.08, 0.10]
  fee_btc: [0.00002, 0.0009]       # uniform range
  round_payment_rate: 0.18         # share of payments a human typed as a round number
  round_units: [1.0, 0.5, 0.1, 0.05, 0.01]
  exchange_share: 0.02             # fraction of base actors that are exchanges
  nat_share_rate: 0.15             # fraction of base actors sharing a NAT/VPN IP (innocent)
  nat_pool_size: 40                # how many shared IPs exist
  wallets_per_actor: [1, 3]

  # fraction of transactions each typology should account for (normalised)
  pattern_mix:
    normal: 0.86
    ransomware_collector: 0.04
    layering: 0.04
    same_actor_cluster: 0.03
    coinjoin: 0.03

  # A typology instance is spread over a window instead of being emitted
  # back-to-back, the way AMLSim gives each pattern a period. Without this the
  # inter-transaction gap alone gives the label away and every model trained on
  # this data reports inflated accuracy. Window = n_txs * gap * spread_factor.
  typology_spread_factor: 20

  typology_params:
    ransomware_collector:
      victims: [15, 60]
      peel_hops: [4, 12]
      ransom_btc: [0.01, 0.35]
      round_ransom_rate: 0.8       # ransom demands are quoted as round figures
      peel_fraction: [0.05, 0.2]
    layering:
      fan: [4, 10]
      depth: [2, 4]
      amount_btc: [1.0, 40.0]
    same_actor_cluster:
      spread_factor: 0          # must stay bursty: one IP, one short window
      wallets: [3, 8]
      window_seconds: 900
      amount_btc: [0.05, 3.0]
    coinjoin:
      participants: [5, 12]
      denomination_btc: [0.01, 0.1, 0.5, 1.0]

  # how a broadcast is observed: home IP, or masked
  broadcast:
    tor_rate: 0.05
    hosting_rate: 0.08

  # example ASN ranges — swap for DB-IP Lite data later
  asn_pools:
    residential:
      - {asn: 9829, name: BSNL, country: IN, prefix: "117.200"}
      - {asn: 55836, name: RJIL, country: IN, prefix: "49.36"}
      - {asn: 24560, name: Airtel, country: IN, prefix: "122.176"}
      - {asn: 7922, name: Comcast, country: US, prefix: "73.14"}
      - {asn: 3320, name: DTAG, country: DE, prefix: "91.65"}
    hosting:
      - {asn: 14061, name: DigitalOcean, country: US, prefix: "159.65"}
      - {asn: 16509, name: AWS, country: US, prefix: "52.66"}
      - {asn: 24940, name: Hetzner, country: DE, prefix: "88.99"}
      - {asn: 9009, name: M247, country: NL, prefix: "185.107"}
    tor_exit:
      - {asn: 208294, name: TorExit, country: DE, prefix: "185.220"}
      - {asn: 4224, name: CalyxTor, country: US, prefix: "162.247"}

gossip:
  n_nodes: 500
  n_relays: 40                     # high-degree public relay nodes
  relay_asn_pool: hosting
  tor_node_share: 0.06             # share of gossip nodes that are Tor exits
  hosting_node_share: 0.25
  peer_degree: 8
  relay_bias: 0.6                  # probability a peer link prefers a relay node
  delay_mean_ms: 150               # exponential forwarding delay
  max_hops_per_tx: 12              # cap on simulated forwarding events per tx
  relay_observation_rate: 0.3      # fraction of hops that appear in the output
  p2p_port: 8333
  ephemeral_ports: [32768, 60999]
